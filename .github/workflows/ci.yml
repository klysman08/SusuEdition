name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Só roda quando há mudanças em src-tauri/ (commits só de frontend pulam ~10 min).
  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Sem debuginfo: link mais rápido e cache menor.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # O Cargo.toml otimiza dependências em `tauri dev` (opt-level 2); no CI isso
      # só deixa a compilação mais lenta.
      CARGO_CI_FLAGS: --config profile.dev.package."*".opt-level=0
    steps:
      - uses: actions/checkout@v5
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri::generate_context! exige que ../dist exista.
      - run: mkdir -p dist
        shell: bash
      - name: Formatação
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # Lints uma vez só (Linux); no Windows basta compilar e testar.
      - name: Clippy
        if: runner.os == 'Linux'
        shell: bash
        run: cargo clippy $CARGO_CI_FLAGS --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Testes
        shell: bash
        run: cargo test $CARGO_CI_FLAGS --manifest-path src-tauri/Cargo.toml
