[package]
name = "susuedition"
version = "0.5.0"
description = "SusuEdition — editor de vídeos e fotos"
authors = ["klysman08"]
license = "UNLICENSED"
repository = "https://github.com/klysman08/SusuEdition"
rust-version = "1.85"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "susuedition_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2.10.1"
tauri-plugin-os = "2.4.0"
thiserror = "2.0.21"
log = "0.4.35"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
kamadak-exif = "0.6.2"
imagesize = "0.15.0"
blake3 = "1.8.7"
infer = "0.22.0"
percent-encoding = "2.3.2"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4"] }
rustfft = "6.4.1"
fs4 = { version = "1.1.0", features = ["sync"] }


[lints.clippy]
all = { level = "warn", priority = -1 }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependências otimizadas mesmo em `tauri dev` (decodificação de imagens fica ~10× mais rápida).
[profile.dev.package."*"]
opt-level = 2
